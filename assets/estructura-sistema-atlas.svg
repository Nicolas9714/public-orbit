<title id="titulo">Estructura de Constellation Colombia</title>
<desc id="descripcion">Árbol del sistema nacional, los 4 atlas sectoriales, sus skills orquestadoras y las 30 entidades registradas.</desc>
<style>
  .fondo { fill: #0D1117; stroke: #30363D; stroke-width: 2; }
  text { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #E6EDF3; paint-order: stroke; stroke: #0D1117; stroke-width: 5px; stroke-linejoin: round; }
  .conexion { fill: none; stroke: #3ECF8E; stroke-width: 1.5; opacity: .48; }
  .sistema circle, .atlas circle, .orquestadora polygon, .entidad circle { fill: #0D1117; stroke: #3ECF8E; }
  .sistema .exterior { stroke-width: 2.4; }
  .sistema .interior { stroke-width: 1.5; }
  .atlas circle { stroke-width: 2.2; }
  .orquestadora polygon { stroke-width: 2; }
  .entidad circle { stroke-width: 1.7; }
  /* Lo que sigue en construcción se dibuja punteado: la rama existe, sus
     skills todavía no. */
  .conexion.construccion, .construccion circle, .construccion polygon { stroke-dasharray: 4 4; opacity: .6; }
  .titulo { font-size: 20px; font-weight: 650; }
  .skill { font-size: 11px; fill: #8B949E; }
  .entidad text { font-size: 14px; font-weight: 560; }
  .etiqueta-atlas { font-size: 17px; font-weight: 650; text-anchor: end; }
  .etiqueta-orq { font-size: 12px; font-weight: 600; text-anchor: middle; fill: #8B949E; }
</style>
