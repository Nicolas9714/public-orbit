<title id="titulo">Órbita de Public Orbit</title>
<desc id="descripcion">Nodo Nacional conectado con 4 atlas sectoriales, sus skills orquestadoras y 30 entidades.</desc>
<style>
  .fondo { fill: #0D1117; stroke: #30363D; stroke-width: 2; }
  text { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #E6EDF3; paint-order: stroke; stroke: #0D1117; stroke-width: 5px; stroke-linejoin: round; }
  .conexion, .orbita { fill: none; stroke: #3ECF8E; }
  .central-orquestadora { stroke-width: .9; opacity: .44; }
  .orquestadora-atlas { stroke-width: .9; opacity: .62; }
  .atlas-entidad { stroke-width: .65; opacity: .28; }
  .orbita { stroke-width: .8; opacity: .2; }
  .nucleo circle, .atlas circle, .orquestadora polygon, .entidad circle { fill: #0D1117; stroke: #3ECF8E; }
  .nucleo .exterior { stroke-width: 1.4; }
  .nucleo .interior { stroke-width: 1; }
  .atlas circle { stroke-width: 1.3; }
  .orquestadora polygon { stroke-width: 1.2; }
  .entidad circle { stroke-width: 1; }
  .nodo.construccion { opacity: .66; }
  .conexion.construccion, .orbita.construccion, .construccion circle, .construccion polygon { stroke-dasharray: 4 4; }
  .titulo { font-size: 22px; font-weight: 650; }
  .nodo-nacional { font-size: 14px; font-weight: 600; fill: #8B949E; }
  .entidad text, .etiqueta-orq { font-size: 14px; font-weight: 560; }
  .etiqueta-atlas { font-size: 18px; font-weight: 650; }
  .estado { font-size: 13px; fill: #8B949E; }
</style>
